[versions]
paper = "26.3.build.175-stable"
cloud = "2.2.0-SNAPSHOT"
cloudPaper = "2.1.0-SNAPSHOT"
coroutine = "1.11.0"
serialization = "1.13.0"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
# 3.2.0 からモジュール分割され、本体の jar は空になったため API を含む core を参照する
betonquest = { group = "org.betonquest.betonquest", name = "core", version = "3.2.0" }
# BetonQuestApi などの公開 API は api モジュールにある
betonquest-api = { group = "org.betonquest.betonquest", name = "api", version = "3.2.0" }
mineauth-api = { group = "party.morino", name = "mineauth-api", version = "0.7.1" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }


cloud = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud" }
cloud-kotlin-coroutines-annotations = { group = "org.incendo", name = "cloud-kotlin-coroutines-annotations", version.ref = "cloud" }
cloudPaper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloudPaper" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.21" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.21" }
shadow = { id = "com.gradleup.shadow", version = "9.7.0-SNAPSHOT" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
resource-factory = { id = "xyz.jpenilla.resource-factory", version = "1.4.0" }

[bundles]
commands = ["cloud", "cloudPaper", "cloud-annotations", "cloud-kotlin-coroutines-annotations"]
coroutines = ["kotlinx-coroutines-core"]
